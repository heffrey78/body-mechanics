# Catalogue v1 (#26, D3): the curated exercises and their tags.
#
# `source: wger:<id>` takes the name's source, instructions, aliases, licence and author from wger
# (scripts/catalogue/build.ts); `source: own` is ours, with its own instructions. Tags (works, strains,
# kinds, measure, sided, sweat, equipment) were drafted by an LLM from public exercise knowledge and
# are reviewed by the owner: `review: pending | approved`, plus any `notes`. `strains` lists regions
# the exercise loads, which the body map warns about (#4); it is a safety field, so err towards
# listing. Regions, kinds and equipment use the vocabularies in packages/engine/src/records/vocab.ts.
#
# One line per exercise: {id, source, name, measure, sided, works, strains, kinds, sweat, equipment, review}

