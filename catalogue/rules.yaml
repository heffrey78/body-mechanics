  - {exercise: bicycle-crunch, region: lowerback, swap: dead-bug}
  - {exercise: ab-wheel, region: lowerback, swap: plank}
  - {exercise: back-extension, region: lowerback, swap: bird-dog}
  - {exercise: superman, region: lowerback, swap: bird-dog}
  - {exercise: toe-touch, region: lowerback, modifiers: [short-range, pain-free-range]}
  - {exercise: rowing-machine, region: lowerback, swap: cycling}

# Default modifiers for a mild mark on a region an exercise strains, when the exercise has no rule above.
defaults:
  neck: [lighter, pain-free-range]
  shoulder: [lighter, below-shoulder, pain-free-range]
  chest: [lighter, short-range]
  upperback: [lighter, pain-free-range]
  upperarm: [lighter]
  forearm: [neutral-grip, lighter]
  core: [lighter, slow-lowering]
  lowerback: [lighter, slow-lowering, pain-free-range]
  hips: [short-range, pain-free-range]
  glutes: [lighter]
  quads: [lighter, short-range]
  hamstrings: [lighter, short-range]
  knee: [short-range, slow-lowering, pain-free-range]
  shin: [no-bounce]
  calf: [lighter, no-bounce]
  ankle: [hold-support, no-bounce]

# ---------------------------------------------------------------- conditions
# Common condition types to pick from (#49). Rules for whole-body conditions are deferred (#5): they
# are listed so they can be recorded, with no rules yet.
conditions:
  - kind: acl-repair
    name: ACL repair
    regions: [knee]
    avoid: [jump-squat, skater-hops, burpee, jumping-jacks, cossack-squat]
    helps: [terminal-knee-extension, straight-leg-raise, spanish-squat, step-up, single-leg-stand, y-balance]
  - kind: hip-replacement
    name: Hip replacement
    regions: [hips]
    avoid: [deep-squat-hold, pigeon-stretch, 90-90-hip-switch, frog-stretch, cossack-squat, jump-squat]
    helps: [glute-bridge, clamshell, side-lying-hip-abduction, sit-to-stand, step-up, single-leg-stand]
  - kind: shoulder-impingement
    name: Shoulder impingement
    regions: [shoulder]
    avoid: [dips, overhead-triceps-extension, front-raise]
    helps: [band-external-rotation, face-pull, band-pull-apart, wall-slides, ytw-raise, scapular-push-up]
  - kind: lumbar-disc
    name: Lumbar disc history
    regions: [lowerback]
    avoid: [crunch, bicycle-crunch, russian-twist, good-morning, toe-touch, superman]
    helps: [mcgill-curl-up, bird-dog, side-plank, dead-bug, glute-bridge, pallof-press]
  - kind: hypermobility
    name: Hypermobility
    regions: []
    avoid: []
    helps: []
