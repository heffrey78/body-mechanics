# Instructions for the catalogue's own exercises (`source: own` in curated.yaml). Written for this
# app and published with the catalogue under CC-BY-SA 4.0 (D3). Short and practical: set-up, the
# movement, and the one thing to watch.
bm:seated-spinal-twist: Sit tall on a chair, feet flat. Turn your chest towards one side, a hand on the chair's back, and breathe out into the turn. Keep your hips facing forward; turn only as far as is comfortable.
bm:ankle-circles: Lift one foot and draw slow circles with your toes, as large as the ankle allows. Circle both ways, then change feet.
bm:doorway-chest-stretch: Stand in a doorway with your forearm on the frame, elbow at shoulder height. Step gently through until you feel a stretch across the front of the chest. Don't push into pain at the front of the shoulder.
bm:wrist-flexor-stretch: Arm straight in front, palm up. With the other hand, ease the fingers down and back until you feel a stretch along the inside of the forearm.
bm:wrist-extensor-stretch: Arm straight in front, palm down. With the other hand, ease the back of the hand down until you feel a stretch along the top of the forearm.
bm:thoracic-extension: Lie back over a foam roller across your upper back, hands supporting your head. Let your upper back extend over the roller, then move it a few centimetres and repeat. Keep the lower back still.
bm:thread-the-needle: On hands and knees, slide one arm under the other, palm up, letting your shoulder and head lower towards the floor. Return and reach that arm up to the ceiling.
bm:worlds-greatest-stretch: Step into a long lunge, back knee down if needed. Put the same-side hand inside the front foot, then rotate and reach the other arm to the ceiling. Return and step back.
bm:lat-stretch: Hold a door frame or wall at head height, step back and sit your hips back, letting your chest drop between your arms. Lean slightly to one side to bias that side.
bm:cross-body-shoulder-stretch: Bring one arm across your chest and hold it above the elbow with the other hand. Keep the shoulder down, away from your ear.
bm:downward-dog: From hands and knees, lift your hips up and back into an upside-down V. Press the floor away and let your heels sink towards it; bend the knees if your hamstrings pull.
bm:calf-raise: Stand on the edge of a step, heels free, holding something for balance. Rise onto your toes, pause, then lower slowly below the step.
bm:lateral-lunge: Step wide to one side and sit the hips back over that leg, keeping the other leg straight and both feet flat. Push back to standing.
bm:sit-to-stand: Sit at the front of a chair, feet under your knees. Lean forward and stand up without using your hands, then sit back down slowly.
bm:straight-leg-raise: Lie on your back, one knee bent. Tighten the thigh of the straight leg and lift it to the height of the other knee, then lower slowly.
bm:spanish-squat: Loop a heavy band behind both knees, anchored in front of you. Lean back into the band and sit into a squat with shins upright, then hold.
bm:reverse-fly: Hinge forward with a flat back, dumbbells hanging. Lift them out to the sides, squeezing your shoulder blades together, and lower slowly.
bm:biceps-curl: Stand with dumbbells at your sides, palms forward. Bend at the elbows to bring them to your shoulders without swinging, then lower slowly.
bm:band-external-rotation: Elbow at your side, bent to 90°, holding a band anchored across your body. Turn the forearm outwards against the band, keeping the elbow tucked in.
bm:band-internal-rotation: Elbow at your side, bent to 90°, holding a band anchored on that side. Turn the forearm inwards across your body against the band.
bm:scapular-push-up: In a push-up position with straight arms, let your chest sink between your shoulder blades, then push the floor away to spread them. Elbows stay straight.
bm:dead-bug: Lie on your back, arms up and knees over hips. Press your lower back into the floor and lower the opposite arm and leg slowly, then return and switch.
bm:mcgill-curl-up: Lie on your back with one knee bent and your hands under your lower back. Lift your head and shoulders a few centimetres as one unit and hold, without flattening your back.
bm:bear-crawl: On hands and feet with knees just off the floor, crawl forward with small steps of opposite hand and foot, keeping your back flat and hips low.
bm:single-leg-stand: Stand on one leg near something to hold, the knee soft. Hold your balance without leaning; touch down when you need to.
bm:heel-to-toe-walk: Walk in a straight line, putting the heel of each foot directly in front of the toes of the other. Look ahead, not down.
bm:single-leg-reach: Stand on one leg and hinge forward, reaching both hands towards the floor as the other leg extends behind. Return tall with control.
bm:bird-dog-hold: On hands and knees, extend one arm and the opposite leg level with your back, and hold without letting your hips tip.
bm:tall-kneeling-press: Kneel upright with a band anchored behind you. Press it forward from your chest without arching your back or rocking.
bm:bottoms-up-kb-hold: Hold a light kettlebell upside down by the handle, elbow at 90° in front of you. Keep it balanced and steady with a firm grip.
bm:y-balance: Stand on one leg and reach the other foot as far as you can forward, then back to each side, touching lightly. Keep the standing knee over your toes.
bm:stair-climb: Climb stairs briskly, one step at a time, holding the rail if you need it. Walk down slowly.
bm:skater-hops: Hop sideways from one foot to the other, landing softly with a bent knee and letting the other leg swing behind.

# Our words for wger exercises whose own instructions are missing or too thin to follow.
bm:single-leg-calf-raise: Stand on one foot on the edge of a step, heel free, holding something for balance. Rise as high as you can, pause, then lower slowly below the step.
bm:overhead-press: Stand with the bar at your collarbones, hands just wider than your shoulders. Brace your trunk and press the bar straight overhead, moving your head back to let it pass, then lower it to your collarbones. Don't lean back.
bm:landmine-press: Hold the end of a bar anchored in a corner at your shoulder. Press it up and forward until your arm is straight, then lower it with control. Brace so your trunk doesn't twist.
bm:split-squat: Stand in a long stride, back heel lifted. Lower straight down until the back knee nearly touches the floor, front shin close to upright, then push back up. Do all reps on one side, then change.
bm:dead-hang: Hang from a pull-up bar with straight arms, hands shoulder-width apart. Let your shoulders relax up but stay in control; step down before your grip fails.
bm:wall-push-up: Stand an arm's length from a wall, hands on it at chest height and a little wider than your shoulders. Bend your elbows to bring your chest towards the wall, then push back. Keep your body in one line; step further back to make it harder.

# Yoga, breathing and waking up (#100, #109): drafted 2026-11-21, awaiting the owner's review.
bm:mountain-pose: Stand with your feet hip-width apart, weight even across both feet. Lengthen up through the crown of your head, shoulders down and relaxed, arms by your sides. Breathe slowly and stay still.
bm:warrior-one: Step one foot back a long stride and turn it out slightly, heel down. Bend the front knee over the ankle, hips facing forward, and reach both arms overhead. Keep the back leg strong.
bm:warrior-two: Stand with your feet wide, front foot pointing forward and back foot turned in. Bend the front knee over the ankle, arms out level with your shoulders, and look over the front hand. Keep the knee tracking over your toes.
bm:triangle-pose: Stand with your feet wide, front foot pointing forward. Keep both legs straight, reach forward over the front leg, then lower that hand to your shin or a block and reach the other arm up. Lengthen rather than bending sideways.
bm:tree-pose: Stand on one leg and place the other foot on the inside of your calf or thigh, never on the knee. Hands at your chest or overhead. Fix your eyes on one point; touch a wall if you need it.
bm:chair-pose: Feet together or hip-width, bend your knees and sit your hips back as if onto a chair, arms reaching up. Keep your weight in your heels and your chest lifted.
bm:standing-side-bend: Stand tall, feet hip-width. Reach one arm overhead and lean gently to the other side, lengthening along the reaching side. Keep your hips steady and breathe into the stretch.
bm:sun-salutation: From standing, reach up, fold forward, step back to a plank, lower down, lift into a cobra, push back to downward dog, then step forward, fold and rise. Move with your breath; one round is one rep.
bm:low-lunge: Step one foot forward into a lunge and lower the back knee to the floor, padded if you like. Sink your hips forward until the front of the back hip stretches, hands on the front knee or reaching up.
bm:puppy-pose: On hands and knees, keep your hips over your knees and walk your hands forward, letting your chest sink towards the floor. Rest your forehead down and let the shoulders open.
bm:seated-forward-fold: Sit with your legs straight in front. Lengthen your back, then fold forward from the hips towards your feet, as far as is comfortable. Bend the knees if your hamstrings pull or your back rounds hard.
bm:bridge-pose: Lie on your back, knees bent and feet flat near your hips. Press through your feet to lift your hips, rolling up through the spine, and hold. Keep your neck still and don't turn your head.
bm:supine-twist: Lie on your back and draw one knee across your body towards the floor, the other leg long. Stretch the opposite arm out and let your shoulders rest down. Breathe and let the twist settle.
bm:happy-baby: Lie on your back, bring your knees towards your armpits and hold the outsides of your feet, soles to the ceiling. Let your lower back rest down; rock gently if it feels good.
bm:reclined-butterfly: Lie on your back with the soles of your feet together and your knees falling open. Rest your arms by your sides. Put cushions under your knees if the stretch is too much.
bm:legs-up-the-wall: Sit side-on to a wall, then swing your legs up it as you lie back, hips close to the wall. Rest your arms by your sides and breathe slowly.
bm:corpse-pose: Lie on your back, legs relaxed and apart, arms a little away from your sides, palms up. Close your eyes and let your body grow heavy. Breathe naturally and stay still.
bm:belly-breathing: Lie down or sit, one hand on your chest and one on your belly. Breathe in through your nose so the belly hand rises and the chest hand stays still, then breathe out slowly.
bm:box-breathing: Sit tall. Breathe in for a count of four, hold for four, breathe out for four, hold for four. Repeat, keeping each part smooth. Shorten the counts if the holds feel strained.
bm:long-exhale-breathing: Sit or lie comfortably. Breathe in through your nose for a count of four, then out slowly through your mouth for six to eight. A longer breath out than in helps the body settle.
bm:body-scan: Lie on your back with your eyes closed. Bring your attention slowly from your toes up to your head, noticing each part and letting it soften as you breathe out.
bm:neck-rolls: Sitting tall, let your chin drop towards your chest, then roll your head slowly from one shoulder to the other and back. Keep to the front half; don't circle the head backwards.
bm:shoulder-rolls: Stand or sit tall and roll your shoulders up, back and down in slow circles. Then roll them the other way.
bm:wrist-circles: Interlace your fingers or keep your hands free, and circle your wrists slowly in both directions, as large as is comfortable.
bm:standing-roll-down: Stand with soft knees. Tuck your chin and roll down one vertebra at a time towards the floor, let your arms hang, then roll back up slowly, stacking your spine.
bm:march-in-place: March on the spot, lifting your knees to a comfortable height and swinging your arms. Build up gently to a steady pace.
